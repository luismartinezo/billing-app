

<div class="gray-bg">

    <div class="middle-box text-center loginscreen animated fadeInDown">
        <div>
            <div>
                <h1 class="logo-name">IN+</h1>
            </div>
            <h3>Welcome to IN+</h3>
            <p>Perfectly designed and precisely prepared admin theme with over 50 pages with extra new web app views.
                <!--Continually expanded and constantly improved Inspinia Admin Them (IN+)-->
            </p>
            <p>Login in. To see it in action.</p>
            <form class="m-t" role="form"
            [formGroup]="loginForm"
            (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <input type="text" id="username"
                    class="form-control"
                    placeholder="Username"
                    formControlName="username"
                    required="">
                </div>
                <div class="form-group">
                    <input type="password"
                    class="form-control"
                    placeholder="Password"
                    required=""
                    formControlName="password">
                </div>
                <button type="submit" class="btn btn-primary block full-width m-b" [disabled]="loading() || loginForm.invalid">
                {{ loading() ? 'Ingresando...' : 'Login' }}
               </button>
                  @if (errorMessage()) {
                      <p class="error">{{ errorMessage() }}</p>
                  }

                <a href="#"><small>Forgot password?</small></a>
                <p class="text-muted text-center"><small>Do not have an account?</small></p>
                <a class="btn btn-sm btn-white btn-block" href="#">Create an account</a>
            </form>
            <p class="m-t"> <small>Luis Martinez &copy; 2026</small> </p>
        </div>
    </div>
