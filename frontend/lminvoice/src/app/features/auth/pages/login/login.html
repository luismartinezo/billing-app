

<div class="gray-bg">

    <div class="middle-box text-center loginscreen animated fadeInDown">
        <div>
            <div class="language-switch mb-3">
                <button class="btn btn-xs" type="button" [class.btn-primary]="language() === 'es'" [class.btn-white]="language() !== 'es'" (click)="setLanguage('es')">ES</button>
                <button class="btn btn-xs" type="button" [class.btn-primary]="language() === 'en'" [class.btn-white]="language() !== 'en'" (click)="setLanguage('en')">EN</button>
            </div>
            <div>
                <h1 class="logo-name">LM</h1>
            </div>
            <h3>{{ 'login.welcome' | translate }}</h3>
            <p>{{ 'login.subtitle' | translate }}</p>
            <p>{{ 'login.prompt' | translate }}</p>
            <form class="m-t" role="form"
            [formGroup]="loginForm"
            (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <input type="text" id="username"
                    class="form-control"
                    [placeholder]="'login.username' | translate"
                    formControlName="username"
                    required="">
                </div>
                <div class="form-group">
                    <input type="password"
                    class="form-control"
                    [placeholder]="'login.password' | translate"
                    required=""
                    formControlName="password">
                </div>
                <button type="submit" class="btn btn-primary block full-width m-b" [disabled]="loading() || loginForm.invalid">
                {{ loading() ? ('login.loading' | translate) : ('login.submit' | translate) }}
               </button>
                  @if (errorMessage()) {
                      <p class="error">{{ errorMessage() }}</p>
                  }

                <a href="#"><small>{{ 'login.forgotPassword' | translate }}</small></a>
                <p class="text-muted text-center"><small>{{ 'login.noAccount' | translate }}</small></p>
                <a class="btn btn-sm btn-white btn-block" href="#">{{ 'login.createAccount' | translate }}</a>
            </form>
            <p class="m-t"> <small>Luis Martinez &copy; 2026</small> </p>
        </div>
    </div>
